[project]
name = "navier-backend"
version = "0.1.0"
description = "NAVIER - nowcasting, tracking e co-pilota AI per lo storm chasing in Italia (backend)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies - enough to run through M0/M1.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Heavy numerical / geo stack, added when the processing milestones need it (M2+).
# Kept out of the core install so M0 stays light on Windows (see the README).
processing = [
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pillow>=10.0",
    "scikit-learn>=1.5",
]
# Co-pilot (M5).
copilot = [
    "google-genai>=0.3",
]
# Voice: WAV playback for the system-TTS pipeline + push-to-talk speech-to-text.
# numpy comes from `processing`.
voice = [
    "sounddevice>=0.4",  # WAV playback + mic capture (PortAudio)
    "SpeechRecognition>=3.10",  # free Google STT endpoint (capture is ours, see app/stt)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
